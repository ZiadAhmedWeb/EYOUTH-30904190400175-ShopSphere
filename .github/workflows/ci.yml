name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend - Install & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}

  build-frontend:
    name: Frontend - Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://eyouth-30904190400175-shop-sphere.vercel.app/api

  deploy:
    name: Deploy to Vercel
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Backend
            project-id: ${{ secrets.VERCEL_PROJECT_ID }}
            working-dir: Backend
          - name: Frontend
            project-id: ${{ secrets.FRONTEND_PROJECT_ID }}
            working-dir: Frontend
          - name: Reviews
            project-id: ${{ secrets.REVIEWS_PROJECT_ID }}
            working-dir: reviews-service
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ matrix.project-id }}
          working-directory: ${{ matrix.working-dir }}
          vercel-args: '--prod'
          vercel-version: '47.2.2'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.project-id }}
